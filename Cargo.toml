[workspace]
package.version = "0.6.1"
package.edition = "2024"
package.license-file = "LICENSE"
resolver = "3"
members = ["bob-cli", "bob-lib"]

[workspace.dependencies]
anyhow = "1.0.104"
ignore = "0.4.34"
log = "0.4.35"
rapidhash = "4.5.1"

[profile.dev]
opt-level = 2

[profile.release]
strip = true
lto = true
codegen-units = 1
